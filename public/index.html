<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TodoNow: a local personal todo tracker">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>TodoNow</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="banner" class="hidden"></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="side-resizer" id="sideResizer" title="Drag to resize, double-click to fit the content"></div>
  <main>
    <header class="top">
      <div class="searchbox">
        <span class="glass">&#9906;</span>
        <input id="q" type="text" placeholder="Search todos. Try in:People, tag:phone, due:today, is:overdue" autocomplete="off" spellcheck="false">
        <span class="hint"><kbd>&#8984;K</kbd></span>
      </div>
    </header>
    <div class="toolbar" id="toolbar"></div>
    <section class="content" id="content"></section>
  </main>
</div>
<aside id="drawer" aria-hidden="true"></aside>
<button class="fab" id="fab" type="button" title="New todo (N)" aria-label="New todo"><svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
<div id="toast"></div>
<script src="/chips.js"></script>
<script src="/folderpick.js"></script>
<script src="/app.js"></script>
</body>
</html>
